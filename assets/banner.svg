raphic"/></feMerge></filter><pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#253556" stroke-opacity=".45" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(14px) rotate(-3deg)}}@keyframes pulseOrb{0%{transform:scale(1);opacity:.25}50%{transform:scale(1.15);opacity:.45}}@keyframes scanline{0%{transform:translateY(-200px);opacity:0}50%{opacity:.6}}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px;fill:#fff}.badge-text,.pill-text,.tagline-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.tagline-text{font-weight:500;font-size:18px;fill:#94a3b8;letter-spacing:.2px}.badge-text,.pill-text{font-weight:600}.badge-text{font-size:13px;letter-spacing:.5px}.pill-text{font-size:12px;fill:#e2e8f0}.floating-cube{animation:floatSlow 7s ease-in-out infinite;transform-origin:980px 210px}.floating-poly{animation:floatReverse 9s ease-in-out infinite;transform-origin:1060px 120px}.animated-ring-1,.animated-ring-2{animation:rotateRing 22s linear infinite;transform-origin:980px 210px}.animated-ring-2{animation:rotateRingRev 28s linear infinite}.ambient-orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.ambient-orb-2{animation:pulseOrb 10s ease-in-out infinite alternate;transform-origin:980px 250px}.dashed-path{stroke-dasharray:6,6;animation:dashAnim 15s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)"/><g opacity=".7"><rect width="1200" height="420" x="0" y="0" fill="url(#grid-pattern)"/></g><circle cx="220" cy="120" r="280" fill="url(#cyan-radial)" class="ambient-orb-1"/><circle cx="960" cy="220" r="320" fill="url(#magenta-radial)" class="ambient-orb-2"/><path fill="url(#primary-glow)" d=