<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>

    <radialGradient id="cyan-radial" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magenta-radial" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Wireframe Cube Gradients -->
    <linearGradient id="cube-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cube-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D Perspective Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#253556" stroke-width="0.8" stroke-opacity="0.45"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.25; }
        50% { transform: scale(1.15); opacity: 0.45; }
      }
      @keyframes scanline {
        0% { transform: translateY(-200px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateRingRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }

      .floating-cube {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: 980px 210px;
      }
      .floating-poly {
        animation: floatReverse 9s ease-in-out infinite;
        transform-origin: 1060px 120px;
      }
      .animated-ring-1 {
        animation: rotateRing 22s linear infinite;
        transform-origin: 980px 210px;
      }
      .animated-ring-2 {
        animation: rotateRingRev 28s linear infinite;
        transform-origin: 980px 210px;
      }
      .ambient-orb-1 {
        animation: pulseOrb 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .ambient-orb-2 {
        animation: pulseOrb 10s ease-in-out infinite alternate;
        transform-origin: 980px 250px;
      }
      .dashed-path {
        stroke-dasharray: 6, 6;
        animation: dashAnim 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Perspective Floor Grid (Dynamic 3D Showroom feel) -->
  <g opacity="0.7">
    <rect x="0" y="0" width="1200" height="420" fill="url(#grid-pattern)"/>
  </g>

  <!-- Animated Ambient Lighting Orbs (Behind content) -->
  <circle class="ambient-orb-1" cx="220" cy="120" r="280" fill="url(#cyan-radial)" />
  <circle class="ambient-orb-2" cx="960" cy="220" r="320" fill="url(#magenta-radial)" />

  <!-- Diagonal Tech Rays / Light Strips -->
  <path d="M -100 420 L 400 -50 L 460 -50 L -40 420 Z" fill="url(#primary-glow)" opacity="0.04"/>
  <path d="M 750 420 L 1250 -50 L 1310 -50 L 810 420 Z" fill="url(#accent-purple)" opacity="0.04"/>

  <!-- ============================================== -->
  <!-- DYNAMIC 3D ASSET SHOWROOM VISUAL (RIGHT SIDE)  -->
  <!-- Positioned safely away from title text         -->
  <!-- ============================================== -->
  <g id="showroom-visual">
    <!-- Rotating Orbital Rings -->
    <ellipse class="animated-ring-1" cx="980" cy="210" rx="145" ry="55" fill="none" stroke="url(#primary-glow)" stroke-width="1.6" opacity="0.6" filter="url(#soft-glow)" transform="rotate(-25 980 210)"/>
    <ellipse class="animated-ring-2" cx="980" cy="210" rx="165" ry="68" fill="none" stroke="url(#accent-purple)" stroke-width="1.2" opacity="0.45" stroke-dasharray="8 6" transform="rotate(35 980 210)"/>

    <!-- Pedestal Stage Rings -->
    <ellipse cx="980" cy="330" rx="120" ry="32" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.3"/>
    <ellipse cx="980" cy="330" rx="140" ry="38" fill="none" stroke="#7000ff" stroke-width="1.2" opacity="0.2" class="dashed-path"/>
    <ellipse cx="980" cy="330" rx="80" ry="20" fill="#00f2fe" fill-opacity="0.08" filter="url(#glow)"/>

    <!-- Central Interactive 3D Wireframe / Solid Isometric Cube (Animated Floating) -->
    <g class="floating-cube">
      <!-- Pedestal Projection Beams -->
      <line x1="980" y1="330" x2="980" y2="210" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 4"/>
      <line x1="910" y1="320" x2="910" y2="200" stroke="#4facfe" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>
      <line x1="1050" y1="320" x2="1050" y2="200" stroke="#ff0080" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>

      <!-- Cube Top Face -->
      <polygon points="980,135 1055,178 980,221 905,178" fill="#13233e" fill-opacity="0.8" stroke="#00f2fe" stroke-width="1.8" filter="url(#soft-glow)"/>
      <!-- Cube Left Face -->
      <polygon points="905,178 980,221 980,305 905,262" fill="#0c182b" fill-opacity="0.85" stroke="#4facfe" stroke-width="1.8"/>
      <!-- Cube Right Face -->
      <polygon points="980,221 1055,178 1055,262 980,305" fill="#191238" fill-opacity="0.85" stroke="#7928ca" stroke-width="1.8"/>

      <!-- Inner Holographic Geometry -->
      <polygon points="980,160 1025,185 980,210 935,185" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.9"/>
      <line x1="980" y1="160" x2="980" y2="210" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
      <line x1="935" y1="185" x2="1025" y2="185" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

      <!-- Hotspot Pins / Annotations -->
      <circle cx="1025" cy="185" r="4" fill="#00f2fe" filter="url(#glow)"/>
      <circle cx="1025" cy="185" r="8" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.75"/>
      
      <circle cx="905" cy="178" r="3.5" fill="#ff0080" filter="url(#glow)"/>
      <circle cx="980" cy="135" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
      <circle cx="980" cy="305" r="3.5" fill="#ffd700" filter="url(#glow)"/>
    </g>

    <!-- Small Secondary Geometric Satellite (Floating Poly) -->
    <g class="floating-poly">
      <polygon points="1080,95 1110,112 1095,138 1065,120" fill="#2d124d" fill-opacity="0.7" stroke="#ff0080" stroke-width="1.5" filter="url(#soft-glow)"/>
      <circle cx="1095" cy="138" r="2.5" fill="#ff0080"/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- FOREGROUND CONTENT LAYER (PERFECT READABILITY) -->
  <!-- Crisp, high contrast, zero overlap with visual -->
  <!-- ============================================== -->
  <g id="foreground-text-layer" transform="translate(70, 0)">
    
    <!-- Top Category Pill / Status Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="#15213b" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="14" cy="15" r="4.5" fill="#00f2fe" filter="url(#soft-glow)"/>
      <text x="27" y="19.5" fill="#38bdf8" class="badge-text">3D ASSET SHOWCASE &amp; WEB SHOWROOMS</text>
    </g>

    <!-- Main Title (Gradient Accent + White) -->
    <g transform="translate(0, 130)">
      <text class="title-text">
        <tspan fill="#ffffff">Awesome </tspan>
        <tspan fill="url(#primary-glow)">3D Asset Showcase</tspan>
      </text>
      <text y="50" class="title-text">
        <tspan fill="#ffffff">&amp; Web Showrooms</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 224)">
      <text class="tagline-text">
        Curated ecosystem of SaaS platforms &amp; open-source engines for
      </text>
      <text y="26" class="tagline-text">
        interactive WebGL, WebGPU, 3D configurators, and virtual galleries.
      </text>
    </g>

    <!-- Feature Pills / Tech Stack Tags -->
    <g transform="translate(0, 290)">
      <!-- Pill 1: WebGL / WebGPU -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="8" fill="#10192e" stroke="#253b65" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#00f2fe"/>
        <text x="28" y="20.5" class="pill-text">WebGL / WebGPU</text>
      </g>

      <!-- Pill 2: 3D Configurators -->
      <g transform="translate(148, 0)">
        <rect width="144" height="32" rx="8" fill="#10192e" stroke="#253b65" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#a855f7"/>
        <text x="28" y="20.5" class="pill-text">3D Configurators</text>
      </g>

      <!-- Pill 3: glTF / GLB / PBR -->
      <g transform="translate(302, 0)">
        <rect width="130" height="32" rx="8" fill="#10192e" stroke="#253b65" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#ec4899"/>
        <text x="28" y="20.5" class="pill-text">glTF / GLB / PBR</text>
      </g>

      <!-- Pill 4: Gaussian Splats -->
      <g transform="translate(442, 0)">
        <rect width="142" height="32" rx="8" fill="#10192e" stroke="#253b65" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#ffd700"/>
        <text x="28" y="20.5" class="pill-text">Gaussian Splats</text>
      </g>

      <!-- Pill 5: Self-Hosted -->
      <g transform="translate(594, 0)">
        <rect width="112" height="32" rx="8" fill="#10192e" stroke="#253b65" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#22c55e"/>
        <text x="28" y="20.5" class="pill-text">Self-Hosted</text>
      </g>
    </g>

    <!-- Bottom Metric / Status Row -->
    <g transform="translate(0, 360)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500">
        ✨ 10+ Curated SaaS Solutions &nbsp;•&nbsp; 🚀 15+ Open-Source Projects &nbsp;•&nbsp; 🌐 Production-Ready Viewers
      </text>
    </g>
  </g>

  <!-- Banner Border Frame Accent -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="12" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.8"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="12" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.25"/>
</svg>
